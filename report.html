<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FR Merchandise Report</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #08111e; color: #e2e8f0; font: 16px system-ui, sans-serif; }
      main { max-width: 420px; padding: 24px; text-align: center; }
      h1 { margin: 0 0 8px; font-size: 20px; }
      p { margin: 0; color: #94a3b8; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main><h1>Report unavailable</h1><p>This report was not found in this browser. Generate it again from FR Merchandise.</p></main>
    <script>
      (() => {
        const reportId = new URLSearchParams(window.location.search).get('report');
        if (!reportId || !/^[a-zA-Z0-9-]+$/.test(reportId)) return;
        try {
          const saved = JSON.parse(localStorage.getItem(`fr-pos-report-${reportId}`));
          if (!saved?.documentHtml || !saved?.createdAt || Date.now() - saved.createdAt > 7 * 24 * 60 * 60 * 1000) return;
          const reportDocument = new DOMParser().parseFromString(saved.documentHtml, 'text/html');
          window.addEventListener('DOMContentLoaded', () => {
            document.documentElement.replaceWith(document.importNode(reportDocument.documentElement, true));
          }, { once: true });
        } catch {
          // Leave the safe unavailable message visible.
        }
      })();
    </script>
  </body>
</html>
